<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Itinerario de Viaje · Europa</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E✈️%3C/text%3E%3C/svg%3E">
<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
/* Variables base estilo Editorial / Minimalista */
:root{
    --bg: #f9f6f0;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #6b7280;
    --line: #eae3d9;
    --accent: #2ecc71;
    --accent-dark: #27ae60;
    --fl: #2b4fd6;
    --tr: #d35400;
    --st: #16a085;
    --vi: #8e44ad;
    --chip: #f0ebe1;
    --chip-on: #1a1a1a;
    --chip-on-t: #ffffff;
    --shadow: 0 10px 30px rgba(0,0,0,0.04);
}

/* Variables para Dark Mode */
:root[data-theme="dark"]{
    --bg: #121619;
    --card: #1b2227;
    --text: #f3f4f6;
    --muted: #9ca3af;
    --line: #2a343d;
    --accent: #2ecc71;
    --accent-dark: #27ae60;
    --fl: #7b9bff;
    --tr: #f0a640;
    --st: #4fcfa8;
    --vi: #f07ab0;
    --chip: #242e35;
    --chip-on: #f3f4f6;
    --chip-on-t: #121619;
    --shadow: 0 10px 30px rgba(0,0,0,0.2);
}
:root[data-theme="dark"] .leaflet-tile-pane { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); }

@media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
        --bg: #121619; --card: #1b2227; --text: #f3f4f6; --muted: #9ca3af; --line: #2a343d;
        --accent: #2ecc71; --accent-dark: #27ae60; --chip: #242e35; --chip-on: #f3f4f6; --chip-on-t: #121619;
        --shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    :root:not([data-theme="light"]) .leaflet-tile-pane { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); }
}

:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; transition: background 0.3s, color 0.3s;}

header{position:relative; padding:30px 20px 10px;max-width:1150px;margin:0 auto}
.header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.logo-area { font-weight: 700; font-size: 1.1rem; letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px; }
.logo-badge { background: var(--accent); color: #fff; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; }

h1{font:700 clamp(1.8rem,4vw,2.6rem)/1.15 system-ui,-apple-system,sans-serif;margin:0 0 8px; letter-spacing: -1px;}
header p{margin:0 0 20px;color:var(--muted);font-size:1.05rem;}

/* Pestañas Principales tipo Cápsula Moderna */
.main-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; border-bottom: 1px solid var(--line); margin-bottom: 24px; scrollbar-width: none; }
.main-tabs::-webkit-scrollbar { display: none; }
.tab-btn { background: var(--card); border: 1px solid var(--line); padding: 10px 20px; font: inherit; font-weight: 600; font-size: 0.95rem; color: var(--text); cursor: pointer; border-radius: 99px; transition: all 0.2s ease; }
.tab-btn:hover { border-color: var(--muted); }
.tab-btn.active { background: var(--text); color: var(--bg); border-color: var(--text); }
.tab-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Contenedores de Vistas */
.view-section { display: none; max-width:1150px; margin:0 auto; padding:0 20px 40px; }
.view-section.active-view { display: block; }
#view-general.active-view { display: grid; grid-template-columns:1.25fr 1fr; gap:24px; }
@media (max-width:820px){ #view-general.active-view { grid-template-columns:1fr; } }

.mapwrap{position:sticky;top:20px;align-self:start;z-index:10}
@media (max-width:820px){.mapwrap{position:static}}

.theme-toggle { background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 50%; width: 40px; height: 40px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.2s ease; }
.theme-toggle:hover { transform: scale(1.05); }

/* Leaflet Mapas */
#map, #mm { width: 100%; height: 500px; border-radius: 24px; border: 1px solid var(--line); background: var(--bg); z-index: 1; box-shadow: var(--shadow);}
.leaflet-popup-content-wrapper { background: var(--card); color: var(--text); border-radius: 16px; border: 1px solid var(--line); box-shadow: var(--shadow); }
.leaflet-popup-tip { background: var(--card); }
.leaflet-popup-content { margin: 14px; font-family: inherit; font-size: 0.92rem; }
.leaflet-popup-content h3 { margin: 0 0 6px 0; font-size: 1.1rem; font-weight: 700; }
.leaflet-popup-content a { color: var(--accent-dark); font-weight: bold; text-decoration: none; }

.city-marker { font-weight: 700; font-size: 13px; color: var(--text); text-shadow: 2px 2px 0 var(--card), -2px -2px 0 var(--card), 2px -2px 0 var(--card), -2px 2px 0 var(--card); white-space: nowrap; position: relative; }
.city-marker::before { content: ''; display: block; width: 14px; height: 14px; background: var(--card); border: 3px solid var(--text); border-radius: 50%; position: absolute; left: -7px; top: 18px; box-shadow: 0 0 0 4px rgba(0,0,0,0.02); }
.city-marker.on::before { background: var(--accent); border-color: var(--accent); transform: scale(1.4); }

.rest-marker { width: 28px !important; height: 28px !important; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11px; border: 2px solid rgba(255,255,255,0.7); transition: transform 0.2s ease, border-color 0.2s ease; }
.rest-marker:hover { transform: scale(1.15); }
.rest-marker.on { transform: scale(1.25); border-color: var(--accent); }
.airbnb-marker, .poi-marker { font-size: 14px; }

.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin:12px 4px 0;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:0;border-top:3px solid;vertical-align:middle;margin-right:5px}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 16px;border-radius:99px;font:inherit;font-size:.9rem;cursor:pointer;min-height:38px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}

/* Tarjetas Estilo Web Moderna */
.card{display:grid;grid-template-columns:85px 1fr;gap:14px;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px;cursor:pointer;transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
.card:hover { transform: translateY(-2px); border-color: var(--muted); }
.card[aria-pressed="true"]{border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent);}
.d{font:700 1rem/1.1 system-ui,sans-serif;text-align:center; display:flex; flex-direction:column; justify-content:center; background:var(--chip); border-radius: 14px; padding: 6px;}.d small{display:block;font-size:.7rem; font-weight:600; margin-top:4px; opacity:0.85;}
.ti{font-weight:700; font-size: 1.05rem; margin-bottom: 2px;}
.su{color:var(--muted);font-size:.9rem}
.ex{display:none;margin-top:10px;font-size:.9rem;border-top:1px solid var(--line);padding-top:10px}
.card[aria-pressed="true"] .ex{display:block}
.empty{color:var(--muted);padding:16px; text-align: center;}
.mgrid{display:grid;grid-template-columns:1.25fr 1fr;gap:24px;align-items:start}
@media (max-width:820px){.mgrid{grid-template-columns:1fr}}
.ex a{color:var(--accent-dark);font-weight:600;display:inline-block;margin-right:12px; text-decoration: none;}
.ex a:hover { text-decoration: underline; }

/* Controles de Búsqueda */
.search-controls { display:flex; gap:10px; margin-bottom:16px; }
.search-input { flex:1; padding:12px 18px; border:1px solid var(--line); border-radius:99px; font:inherit; font-size:0.95rem; background:var(--card); color:var(--text); outline:none; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
.search-input:focus { border-color: var(--accent); }
.btn-toggle-pins { background:var(--text); color:var(--bg); padding:12px 20px; border-radius:99px; font:inherit; font-size:0.9rem; font-weight:600; border:none; cursor:pointer; transition: opacity 0.2s ease; }
.btn-toggle-pins:hover { opacity:0.85; }
.btn-toggle-pins.off { background:var(--chip); color:var(--text); border: 1px solid var(--line); }

.add-place-panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 16px;
    margin: 0 0 18px;
    box-shadow: var(--shadow);
}
.add-place-header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom: 12px;
    font-size: 0.9rem;
    color: var(--muted);
}
.add-place-header strong { color: var(--text); font-size: 1rem; }
.add-place-form { display:grid; gap:10px; }
.add-place-fields { display:grid; grid-template-columns: 1.5fr 1.5fr 0.8fr; gap:10px; }
.add-place-fields.secondary { grid-template-columns: 1fr 1fr 1fr; }
.add-place-form input,
.add-place-form select,
.add-place-form button {
    border-radius: 12px;
    font: inherit;
    font-size: 0.94rem;
}
.add-place-form input,
.add-place-form select {
    width:100%;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--line);
    padding: 12px 14px;
    outline:none;
}
.add-place-form input:focus,
.add-place-form select:focus { border-color: var(--accent); }
.btn-add-place {
    background: var(--text);
    color: var(--bg);
    border: none;
    padding: 12px 16px;
    cursor:pointer;
    font-weight:700;
}
.btn-add-place:hover { opacity: 0.9; }
@media (max-width:760px){
    .add-place-fields,
    .add-place-fields.secondary { grid-template-columns: 1fr; }
    .search-controls { flex-direction: column; }
}
</style>
</head>
<body>
<header>
  <div class="header-top">
      <div class="logo-area"><div class="logo-badge">✈️</div> Viaje Europa</div>
      <button id="themeToggle" class="theme-toggle" aria-label="Cambiar tema">🌙</button>
  </div>
  <h1>Itinerario y Guía de Viaje</h1>
  <p>Madrid, Toledo, Roma y Barcelona.</p>
  
  <nav class="main-tabs">
    <button class="tab-btn active" data-target="general">Viaje General</button>
    <button class="tab-btn" data-target="madrid">Madrid</button>
    <button class="tab-btn" data-target="toledo">Toledo</button>
    <button class="tab-btn" data-target="roma">Roma</button>
    <button class="tab-btn" data-target="barcelona">Barcelona</button>
  </nav>
</header>

<main>
  <!-- VISTA 1: VIAJE GENERAL -->
  <div id="view-general" class="view-section active-view">
      <section class="mapwrap" aria-label="Mapa del viaje">
        <div id="map" role="img" aria-label="Mapa interactivo"></div>
        <div class="legend"><span><i style="border-color:var(--fl)"></i>Vuelo</span><span><i style="border-color:var(--tr);border-top-style:dashed"></i>Tren</span><span>🏠 Alojamiento</span><span>📍 Visitas</span></div>
      </section>
      <section aria-label="Eventos">
        <div class="chips" id="chips" role="group"></div>
        <div id="list"></div>
      </section>
  </div>

  <!-- VISTA 2: DETALLE POR CIUDAD -->
  <div id="view-detail" class="view-section">
      <h2 id="detail-title" style="font:700 clamp(1.4rem,3.5vw,1.9rem)/1.2 system-ui,sans-serif;margin:0 0 6px; letter-spacing: -0.5px;">Ciudad en detalle</h2>
      <p id="detail-desc" style="color:var(--muted);margin:0 0 16px;">Puntos clave, alojamiento, restaurantes y tiendas detalladas.</p>
      
      <div class='mgrid'>
          <div class="mapwrap">
              <div id='mm' role='img'></div>
          </div>
          <div>
              <div class="search-controls">
                  <input type="text" id="search-box" class="search-input" placeholder="Buscar lugares, ej: 'Zara'..." autocomplete="off">
                  <button id="toggle-pins" class="btn-toggle-pins">Ocultar Pines</button>
              </div>

              <div class="add-place-panel">
                <div class="add-place-header">
                  <strong>Agregar lugar</strong>
                  <span>Se guarda en este navegador</span>
                </div>
                <form id="add-place-form" class="add-place-form">
                  <div class="add-place-fields">
                    <input id="place-name" name="place-name" type="text" placeholder="Nombre del lugar" required>
                    <input id="place-address" name="place-address" type="text" placeholder="Dirección o barrio" required>
                    <select id="place-category" name="place-category">
                      <option value="c">Clásico</option>
                      <option value="t">Tapas</option>
                      <option value="d">Dulce</option>
                      <option value="s">Compras</option>
                    </select>
                  </div>
                  <div class="add-place-fields secondary">
                    <input id="place-lat" name="place-lat" type="number" step="any" placeholder="Latitud (opcional)">
                    <input id="place-lng" name="place-lng" type="number" step="any" placeholder="Longitud (opcional)">
                    <button type="submit" class="btn-add-place">Agregar</button>
                  </div>
                </form>
              </div>

              <div class='chips' id='mc' role='group'></div>
              <div id='ml'></div>
          </div>
      </div>
  </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// --- TEMA OSCURO/CLARO ---
const themeToggle = document.getElementById('themeToggle');
const isSystemDark = () => matchMedia('(prefers-color-scheme: dark)').matches;
const isCurrentDark = () => document.documentElement.getAttribute('data-theme') === 'dark' || (!document.documentElement.hasAttribute('data-theme') && isSystemDark());
themeToggle.textContent = isCurrentDark() ? '☀️' : '🌙';
themeToggle.addEventListener('click', () => {
    const newTheme = isCurrentDark() ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', newTheme);
    themeToggle.textContent = newTheme === 'dark' ? '☀️' : '🌙';
});

const transitPOIs = [

];

 {

    su: "Trayecto inicial transatlántico",

const CUSTOM_PLACES_KEY = 'travel-page-custom-places-v1';
const readCustomPlaces = () => {
    try {
        const raw = localStorage.getItem(CUSTOM_PLACES_KEY);
        return raw ? JSON.parse(raw) : {};
    } catch {
        return {};
    }
};
const writeCustomPlaces = (data) => {
    localStorage.setItem(CUSTOM_PLACES_KEY, JSON.stringify(data));
};
const getCityPlaces = (cityKey) => {
    const base = lugares[cityKey] || [];
    const custom = readCustomPlaces()[cityKey] || [];
    return [...base, ...custom];
};
const getNextCustomId = () => {
    const all = Object.values(readCustomPlaces()).flat();
    const ids = all.map(p => Number(p.id) || 0);
    return ids.length ? Math.max(...ids) + 1 : 9000;
};

const tileUrl = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
const col = {vuelo:"#2b4fd6", tren:"#d35400", alojamiento:"#16a085", visita:"#8e44ad"};
const CC = {c:'#d35400', t:'#16a085', d:'#8e44ad', s:'#2980b9'};
const CL = {c:'Clásico', t:'Tapas', d:'Dulce', s:'Compras'};

// Iconos
const getTransitIcon = (t) => L.divIcon({className:'rest-marker-container', html:`<div class="rest-marker poi-marker" style="background:${t==='vuelo'?'#2b4fd6':'#d35400'}">${t==='vuelo'?'✈️':'🚆'}</div>`, iconSize:[28,28], iconAnchor:[14,14]});
const airbnbIcon = L.divIcon({className:'rest-marker-container', html:`<div class="rest-marker airbnb-marker" style="background:#16a085">🏠</div>`, iconSize:[28,28], iconAnchor:[14,14]});
const getRestIcon = (c, id) => L.divIcon({className:'rest-marker-container', html:`<div class="rest-marker" style="background:${CC[c]}">${id}</div>`, iconSize:[28,28], iconAnchor:[14,14]});

// --- MAPA 1: GENERAL ---
const map1 = L.map('map').setView([40.5, -4], 4);
L.tileLayer(tileUrl, { attribution: '&copy; OpenStreetMap' }).addTo(map1);
let activeCity = null, activeEvent = null;

// Rutas
[{type:'vuelo',p:[getPoi('t4'),getPoi('t1')]}, {type:'tren',p:[getPoi('t5'),getPoi('t6')]}, {type:'vuelo',p:[getPoi('t1'),getPoi('t2')]}, {type:'vuelo',p:[getPoi('t2'),getPoi('t3')]}, {type:'tren',p:[getPoi('t5'),getPoi('t7')]}].forEach(r => {
    L.polyline(r.p, {color: col[r.type], weight:3, dashArray: r.type==='tren'?'6, 6':null, opacity:0.8}).addTo(map1);
});

const cityMarkers = {};
Object.keys(C).forEach(c => {
    const m = L.marker(C[c], {icon: L.divIcon({className:'city-marker', html:`<div style="transform:translate(10px,-24px)">${c}</div>`, iconSize:[0,0]})}).addTo(map1);
    m.on('click', () => setCity(activeCity === c ? null : c));
    cityMarkers[c] = m;
});

// Chips Filtro General
const chipsContainer = document.getElementById("chips");
["Todos", "SJO", "Madrid", "Toledo", "Roma", "Barcelona"].forEach(n => {
    const b = document.createElement("button"); b.className = "chip"; b.textContent = n;
    b.onclick = () => setCity(n === "Todos" ? null : n); b.dataset.n = n; chipsContainer.appendChild(b);
});

function setCity(c) {
    activeCity = c; activeEvent = null;
    chipsContainer.querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed", String((b.dataset.n==="Todos" && !activeCity) || b.dataset.n===activeCity)));
    Object.keys(cityMarkers).forEach(n => { const el = cityMarkers[n].getElement(); if(el) el.classList.toggle('on', n===activeCity); });
    if(c) map1.flyTo(C[c], c==='SJO'?6:7, {duration:1}); else map1.flyTo([40.5, -4], 4, {duration:1});
    renderList();
}

function renderList() {
    const Lst = document.getElementById("list"); Lst.innerHTML = "";
    const items = E.filter(e => !activeCity || e.c.includes(activeCity));
    if(!items.length) { Lst.innerHTML = '<p class="empty">No hay eventos.</p>'; return; }
    items.forEach(e => {
        const b = document.createElement("button"); b.className = "card"; b.style.setProperty("--c", col[e.t]);
        b.innerHTML = `<div class="d">${e.d}<small>${e.w}</small></div><div><div class="ti">${e.ti}</div><div class="su">${e.su}</div>${e.ex?`<div class="ex">${e.ex}</div>`:""}</div>`;
        
        b.querySelectorAll('a')?.forEach(a => a.addEventListener('click', ev => ev.stopPropagation()));
        b.onclick = () => {
            activeEvent = activeEvent === e.id ? null : e.id;
            renderList();
        };
        if (e.id === activeEvent) b.setAttribute("aria-pressed", "true");
        
        Lst.appendChild(b);
    });
}
setCity(null);

// --- MAPA 2: DETALLE DINÁMICO CON BÚSQUEDA Y PINES TOGGLE ---
const map2 = L.map('mm').setView([40.417, -3.702], 13);
L.tileLayer(tileUrl, { attribution: '&copy; OpenStreetMap' }).addTo(map2);

let currentDetailCity = 'madrid';
let mc = null, ms = null;
let detailLayerGroup = L.layerGroup().addTo(map2);
let restMarkers = {};
let searchTerm = '';
let showPins = true;

const mCh = document.getElementById('mc');
[['', 'Todos'], ['c', 'Clásicos'], ['t', 'Tapas'], ['d', 'Dulce'], ['s', 'Compras']].forEach(([k, l]) => {
    const b = document.createElement('button'); b.className = 'chip'; b.textContent = l; b.dataset.k = k;
    b.onclick = () => { mc = k || null; ms = null; mDraw(); map2.closePopup(); map2.flyTo(C[currentDetailCity.charAt(0).toUpperCase() + currentDetailCity.slice(1)], 14); };
    mCh.appendChild(b);
});

const searchBox = document.getElementById('search-box');
searchBox.addEventListener('input', (e) => {
    searchTerm = e.target.value.toLowerCase();
    mDraw();
});

const togglePinsBtn = document.getElementById('toggle-pins');
togglePinsBtn.addEventListener('click', () => {
    showPins = !showPins;
    togglePinsBtn.textContent = showPins ? 'Ocultar Pines' : 'Mostrar Pines';
    if (!showPins) togglePinsBtn.classList.add('off'); else togglePinsBtn.classList.remove('off');
    mDraw();
});

function mSel(id) {
    ms = ms === id ? null : id; mDraw();
    if(ms) {
        const r = getCityPlaces(currentDetailCity).find(x => x.id === ms);
        if(r) {
            map2.flyTo([r.a, r.o], 16, {duration: 0.8});
            if (restMarkers[id]) restMarkers[id].openPopup();
            document.getElementById('view-detail').scrollIntoView({behavior: 'smooth', block: 'start'});
        }
    } else map2.closePopup();
}

function mDraw() {
    mCh.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', String((b.dataset.k || null) === mc)));
    const mL = document.getElementById('ml'); mL.innerHTML = '';
    const cityPlaces = getCityPlaces(currentDetailCity);

    cityPlaces.forEach(r => {
        const matchCategory = !mc || r.c === mc;
        const matchSearch = r.n.toLowerCase().includes(searchTerm) || (r.x || '').toLowerCase().includes(searchTerm) || (r.d || '').toLowerCase().includes(searchTerm);
        const visible = matchCategory && matchSearch;
        
        if (visible && showPins) {
            detailLayerGroup.addLayer(restMarkers[r.id]);
        } else {
            detailLayerGroup.removeLayer(restMarkers[r.id]);
        }
        
        const el = restMarkers[r.id] ? restMarkers[r.id].getElement() : null;
        if(el) { const mInner = el.querySelector('.rest-marker'); if(mInner) mInner.classList.toggle('on', r.id === ms); }
        if(!visible) return;
        
        const d = document.createElement('div'); d.className = 'card'; d.style.setProperty('--c', CC[r.c]); d.setAttribute('aria-pressed', String(r.id === ms));
        d.innerHTML = `<div class='d'>${r.id}<small>${CL[r.c] || 'Lugar'}</small></div><div><div class='ti'>${r.n}</div><div class='su'>${r.d}</div><div class='ex'>${r.x || 'Lugar añadido manualmente'}<br><a target='_blank' rel='noopener' href='https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(r.n + ', ' + r.d)}'>Ver en Google Maps ↗</a></div></div>`;
        d.querySelectorAll('a').forEach(a => a.onclick = e => e.stopPropagation()); d.onclick = () => mSel(r.id);
        mL.appendChild(d);
    });
}

function renderDetailCity(cityKey) {
    currentDetailCity = cityKey; 
    mc = null; 
    ms = null;
    searchTerm = '';
    searchBox.value = '';
    showPins = true;
    togglePinsBtn.textContent = 'Ocultar Pines';
    togglePinsBtn.classList.remove('off');
    detailLayerGroup.clearLayers(); restMarkers = {};

    const cityPlaces = getCityPlaces(cityKey);

    if(airbnbs[cityKey] && showPins) {
        const a = airbnbs[cityKey];
        const m = L.marker([a.lat, a.lng], {icon: airbnbIcon, zIndexOffset: 1000}).addTo(detailLayerGroup);
        let pdfLinks = `<a href="${a.pdf}" target="_blank" rel="noopener">Ver comprobante ↗</a>`;
        if(a.pdfDetail) pdfLinks += ` | <a href="${a.pdfDetail}" target="_blank" rel="noopener">Ver Guía y Detalles ↗</a>`;
        m.bindPopup(`<h3>${a.ti}</h3><p>${a.su}</p><br>${pdfLinks}`);
        m.on('click', () => map2.flyTo([a.lat, a.lng], 16));
    }

    transitPOIs.filter(p => p.city === cityKey).forEach(poi => {
        if(showPins){
            const m = L.marker([poi.lat, poi.lng], {icon: getTransitIcon(poi.type)}).addTo(detailLayerGroup);
            m.bindPopup(`<h3>${poi.name}</h3>`);
            m.on('click', () => map2.flyTo([poi.lat, poi.lng], 15));
        }
    });

    cityPlaces.forEach(r => {
        const m = L.marker([r.a, r.o], {icon: getRestIcon(r.c, r.id)});
        m.bindPopup(`<h3>${r.n}</h3><p style="margin:0 0 6px 0">${r.d}</p>${r.x || 'Lugar añadido manualmente'}<br><a target='_blank' rel='noopener' href='https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(r.n + ', ' + r.d)}'>Ver en Google Maps ↗</a>`);
        m.on('click', () => mSel(r.id));
        restMarkers[r.id] = m;
    });

    const CityCap = cityKey.charAt(0).toUpperCase() + cityKey.slice(1);
    map2.flyTo(C[CityCap], cityKey==='toledo'? 15 : 13, {duration: 0});
    mDraw();
}

const addPlaceForm = document.getElementById('add-place-form');
const placeNameInput = document.getElementById('place-name');
const placeAddressInput = document.getElementById('place-address');
const placeCategoryInput = document.getElementById('place-category');
const placeLatInput = document.getElementById('place-lat');
const placeLngInput = document.getElementById('place-lng');

addPlaceForm.addEventListener('submit', (event) => {
    event.preventDefault();
    const name = placeNameInput.value.trim();
    const address = placeAddressInput.value.trim();
    const category = placeCategoryInput.value;
    if (!name || !address) return;

    const cityKey = currentDetailCity;
    const customPlaces = readCustomPlaces();
    const cityCenter = C[cityKey.charAt(0).toUpperCase() + cityKey.slice(1)] || [40.41, -3.7];
    const parsedLat = placeLatInput.value !== '' ? Number(placeLatInput.value) : cityCenter[0] + (Math.random() - 0.5) * 0.02;
    const parsedLng = placeLngInput.value !== '' ? Number(placeLngInput.value) : cityCenter[1] + (Math.random() - 0.5) * 0.02;

    const newPlace = {
        id: getNextCustomId(),
        n: name,
        c: category,
        d: address,
        a: Number.isFinite(parsedLat) ? parsedLat : cityCenter[0],
        o: Number.isFinite(parsedLng) ? parsedLng : cityCenter[1],
        x: 'Lugar añadido por el usuario.'
    };

    customPlaces[cityKey] = [...(customPlaces[cityKey] || []), newPlace];
    writeCustomPlaces(customPlaces);
    addPlaceForm.reset();
    renderDetailCity(cityKey);
});

// --- LOGICA DE PESTAÑAS ---
const tabs = document.querySelectorAll('.tab-btn');
const viewGeneral = document.getElementById('view-general');
const viewDetail = document.getElementById('view-detail');
const detailTitle = document.getElementById('detail-title');

tabs.forEach(btn => {
    btn.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        btn.classList.add('active');
        const target = btn.dataset.target;
        
        if (target === 'general') {
            viewGeneral.classList.add('active-view'); viewDetail.classList.remove('active-view');
            setTimeout(() => map1.invalidateSize(), 50);
        } else {
            viewGeneral.classList.remove('active-view'); viewDetail.classList.add('active-view');
            detailTitle.textContent = target.charAt(0).toUpperCase() + target.slice(1) + " en detalle";
            renderDetailCity(target);
            setTimeout(() => map2.invalidateSize(), 50);
        }
    });
});

setTimeout(() => { map1.invalidateSize(); map2.invalidateSize(); }, 200);
</script>
